[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "horloge-jdr"
version = "1.0.0"
description = "Horloge manuelle et compteur de jours pour parties de JDR (affichage + contrôle)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "CC-BY-NC-SA-4.0" }
authors = [{ name = "Idao-dev" }]

[tool.setuptools.packages.find]
where = ["src"]
